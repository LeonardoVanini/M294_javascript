<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Watchlist CRUD</title>

  <link rel="stylesheet" href="ese12.css">
</head>
<body>

  <div class="container">

    <h1>🎬 Watchlist</h1>

    <!-- STATUS -->
    <p id="status" class="status"></p>

    <!-- FORM -->
    <form id="watchlistForm">

      <div class="form-grid">

        <div class="form-group">
          <label for="title">Titolo</label>
          <input type="text" id="title" required>
        </div>

        <div class="form-group">
          <label for="type">Tipo</label>
          <select id="type" required>
            <option value="">Seleziona</option>
            <option value="Film">Film</option>
            <option value="Serie TV">Serie TV</option>
            <option value="Anime">Anime</option>
            <option value="Documentario">Documentario</option>
          </select>
        </div>

        <div class="form-group">
          <label for="platform">Piattaforma</label>
          <input
            type="text"
            id="platform"
            placeholder="Netflix, Prime Video..."
            required
          >
        </div>

        <div class="form-group">
          <label for="statusWatch">Stato</label>
          <select id="statusWatch" required>
            <option value="">Seleziona</option>
            <option value="Da vedere">Da vedere</option>
            <option value="In corso">In corso</option>
            <option value="Completato">Completato</option>
          </select>
        </div>

        <div class="form-group">
          <label for="rating">Rating</label>
          <input
            type="number"
            id="rating"
            min="1"
            max="10"
            required
          >
        </div>

        <div class="form-group">
          <label for="coverUrl">Cover URL</label>
          <input
            type="url"
            id="coverUrl"
            placeholder="https://..."
            required
          >
        </div>

      </div>

      <div class="form-group full-width">
        <label for="notes">Note</label>
        <textarea
          id="notes"
          rows="4"
          placeholder="Scrivi delle note..."
        ></textarea>
      </div>

      <button id="submitBtn" type="submit" class="btn-save">
        Salva
      </button>

    </form>

    <!-- LISTA -->
    <section class="list-section">

      <h2>Lista elementi</h2>

      <div id="watchlistContainer" class="cards-container">

  </div>

</body>
