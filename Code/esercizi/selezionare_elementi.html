<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="lista">
        <li>Primo</li>
    </ul>

    <script>
        let lista = document.querySelector("ul");
        let nuovo = document.createElement("li")
        nuovo.textContent = "Nuovo studente";

        lista.prepend(nuovo)
        
        //nuovo.remove()
    </script>
</body>
</html>
